<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אביה המבטחת</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="app">
      <h1>אביה המבטחת</h1>
      <h2 class="subtitle">הביטוח שומר לנו על התחת</h2>
      <p id="currentDate" class="current-date"></p>

      <section class="button-row main-actions">
        <button id="agentAppointmentBtn" class="btn btn-success">מינוי סוכן 30%</button>
        <button id="surveyBtn" class="btn btn-fail">סקירה 100%</button>
      </section>

      <section class="sales-input-section">
        <div class="input-group">
          <label for="saleAmountInput">הזן סכום מכירה:</label>
          <input id="saleAmountInput" type="number" step="0.01" inputmode="decimal" placeholder="סכום..." />
          <button id="addSaleBtn" class="btn btn-sales">הוסף</button>
        </div>
      </section>

      <section class="summary" aria-live="polite">
        <h2 class="summary-title">סיכום יומי</h2>
        <table class="summary-table" aria-label="סיכום יומי">
          <tbody>
            <tr><td>מינוי סוכן 30%</td><td><strong id="agentAppointmentCount">0</strong></td></tr>
            <tr><td>סקירה 100%</td><td><strong id="surveyCount">0</strong></td></tr>
            <tr><td>סה"כ סכום מכירות</td><td><strong id="totalSalesAmount">0</strong></td></tr>
            <tr><td>פירוט מכירות</td><td><div id="salesList" class="sales-list"></div></td></tr>
          </tbody>
        </table>

        <form id="editForm" class="edit-form hidden">
          <label>
            מינוי סוכן 30%
            <input id="editAgentAppointment" type="number" min="0" step="1" inputmode="numeric" required />
          </label>

          <label>
            סקירה 100%
            <input id="editSurvey" type="number" min="0" step="1" inputmode="numeric" required />
          </label>

          <button id="applyEditBtn" class="btn btn-apply-edit" type="submit">שמירת תיקון</button>
        </form>
      </section>

      <section class="bottom-tabs" aria-label="טאבים תחתונים">
        <div class="bottom-tabs-row">
          <button id="openSummaryBtn" class="btn btn-summary" type="button">סיכום יומי</button>
          <button id="lockDayBtn" class="btn btn-lock-day" type="button">נעילה</button>
          <button id="toggleEditBtn" class="btn btn-edit" type="button">עריכה</button>
        </div>
        <p id="tabsCapacityInfo" class="tabs-capacity-info"></p>
      </section>
    </main>

    <audio id="soundEffect" style="display: none;"></audio>

    <dialog id="summaryDialog" class="summary-dialog">
      <form method="dialog" class="dialog-header">
        <h3>סיכום חודשי והיסטוריית סיכומים</h3>
        <button class="close-btn" value="cancel">סגירה</button>
      </form>

      <label for="monthPicker">בחירת חודש:</label>
      <input id="monthPicker" type="month" />

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>מינוי סוכן 30%</th>
              <th>סקירה 100%</th>
              <th>סה"כ סכום מכירות</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody"></tbody>
          <tfoot id="summaryTableFoot"></tfoot>
        </table>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
